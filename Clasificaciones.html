    <body>
        <mi-cabecera></mi-cabecera>
        <div class="container gx-0 cuerpo">
                                
            <div class="custom-dropdown">
                <button class="dropdown-btn">GENERAL <span class="dropdown-icon">&#9662;</span> </button>
                    <ul class="dropdown-menu">
                        <li data-value="General">GENERAL</li>
                        <li data-value="municipio1">MORA DE RUBIELOS</li>
                        <li data-value="municipio2">Municipio 3</li>
                    </ul>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>POSICION</th>
                        <th>NOMBRE DE USUARIO</th>
                        <th>LUGAR</th>
                        <th>PARTIDOS JUGADOS </th>
                        <th>PARTIDOS GANADOS</th>
                        <th>ULTIMO RESULTADO </th>
                        <th>%VICTORIAS</th>
                    </tr>
                </thead>
                
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Dieca11</td>
                        <td>MORA DE RUBIELOS</td>
                        <td>10</td>
                        <td>9</td>
                        <td>6-0/3-6/6-2</td>
                        <td>90%</td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Dieca11</td>
                        <td>VALBONA</td>
                        <td>10</td>
                        <td>9</td>
                        <td>6-0/3-6/6-2</td>
                        <td>90%</td>
                    </tr>
                </tbody>
            </table>
        </div>
        

        
        <script>
        const dropdownBtn = document.querySelector('.dropdown-btn');
        const dropdownMenu = document.querySelector('.dropdown-menu');

        dropdownBtn.addEventListener('click', () => {
        dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
        });

        dropdownMenu.querySelectorAll('li').forEach(option => {
        option.addEventListener('click', () => {
            dropdownBtn.childNodes[0].textContent = option.textContent;
            dropdownMenu.style.display = 'none';
        });
        });

        document.addEventListener('click', (event) => {
        if (!event.target.closest('.custom-dropdown')) {
            dropdownMenu.style.display = 'none';
        }
        });
        </script>
        
        
        <script src = js/cabecera.js></script>
